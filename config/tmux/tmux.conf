# ── Prefix: Ctrl-a instead of Ctrl-b ─────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Mouse + scrollback ───────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000

# Trackpad scroll enters copy mode and exits cleanly when you scroll back to the bottom
bind -T copy-mode-vi WheelUpPane   send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down

# ── Sensible defaults ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -sg escape-time 10

# Forward modified keys (Shift/Ctrl/Alt+Enter) instead of collapsing them to
# plain Enter. Required by TUI agents like pi and Claude Code. csi-u needs 3.5+.
set -s extended-keys on
set -s extended-keys-format csi-u

set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s set-clipboard external

# ── Copy mode uses vi keys; y copies to macOS clipboard ──────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Pane navigation: prefix + arrow (repeatable) ─────────────────────
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D

# ── Pane resizing: prefix + Shift+arrow (repeatable) ─────────────────
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# ── Splits that keep the current directory ───────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Seamless Vim/tmux navigation (christoomey/vim-tmux-navigator) ─────
# Ctrl+h/j/k/l moves across both Neovim splits and tmux panes, no prefix.
# Panes matching this pattern keep Ctrl+h/j/k/l for themselves; every other
# pane uses them for tmux navigation. TUI agents must be included or tmux
# swallows keys they need: pi uses C-j for newline and C-l for the model
# selector, and the process name is literally `pi` / `claude`.
#
# The test is a tmux format (`if -F`), not `if-shell`. The old version forked
# `ps | grep` on every keypress, which measured ~22ms here with ~800 processes
# on the box and got worse as the agent fleet grew. A format is evaluated
# inside tmux with no fork, so the same check is free.
is_passthrough="#{m/ri:^(view|l?n?vim?x?|fzf|pi|claude)(diff)?$,#{pane_current_command}}"
bind-key -n 'C-h' if -F "$is_passthrough" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if -F "$is_passthrough" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if -F "$is_passthrough" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if -F "$is_passthrough" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ── Reload config with prefix + r ────────────────────────────────────
bind r source-file "$MCV_SHARE/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# ── Status line: gruvbox-material, pill-shaped window tabs ───────────
# Palette (gruvbox material dark, medium contrast):
#   bg0 #282828 · bg1 #32302f (bar) · bg2 #3c3836 (inactive tab) · bg3 #45403d
#   fg  #d4be98 · grey #928374
#   aqua #7daea3 · green #a9b665 · yellow #d8a657 · red #ea6962
#
# Tabs are drawn as rounded pills using the Nerd Font half-circle glyphs
# U+E0B6 () and U+E0B4 (). JetBrains Mono Nerd Font is installed, so they
# render seamlessly. On a font without Nerd glyphs, delete those two
# characters from the four format strings below and the bar still works.
#
# The window formats deliberately carry no fg/bg for the tab *text* - they use
# `#[default]`, which resets to whichever style tmux picked for that window
# (window-status-style / -current-style / -activity-style / -bell-style). That
# is what lets an activity or bell recolor a tab without duplicating formats.

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#32302f,fg=#d4be98"

# Left: session name. Green normally, yellow while the prefix is held, so you
# can see whether tmux is waiting on the second half of a chord.
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,#d8a657,#a9b665},bg=#32302f]#[fg=#282828,bg=#{?client_prefix,#d8a657,#a9b665},bold]  #S #[fg=#{?client_prefix,#d8a657,#a9b665},bg=#32302f,nobold] "

# Tabs.
set -g window-status-separator " "
set -g window-status-style          "fg=#928374,bg=#3c3836"
set -g window-status-current-style  "fg=#282828,bg=#7daea3,bold"
set -g window-status-activity-style "fg=#d8a657,bg=#3c3836,bold"
set -g window-status-bell-style     "fg=#ea6962,bg=#3c3836,bold"
set -g window-status-format         "#[fg=#3c3836,bg=#32302f]#[default] #I #W#{?window_zoomed_flag,  ,} #[fg=#3c3836,bg=#32302f]"
set -g window-status-current-format "#[fg=#7daea3,bg=#32302f,nobold]#[default] #I #W#{?window_zoomed_flag,  ,} #[fg=#7daea3,bg=#32302f,nobold]"

set -g pane-border-style        "fg=#45403d"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style            "bg=#45403d,fg=#d4be98"
set -g message-command-style    "bg=#45403d,fg=#d4be98"
set -g mode-style               "bg=#7daea3,fg=#282828"

# ── tower: agent fleet ───────────────────────────────────────────────
# Minimap in the status line: ◐ waiting · ● working · ○ idle, blank when
# no agents are running. Agents publish state via `tower-publish`, which
# calls refresh-client -S, so this updates on change rather than on a timer.
#
# tower-status emits its own `#[default]`, which resets to status-style - so it
# has to sit on the bar background, ahead of the clock pill, not inside one.
set -g status-right-length 100
set -g status-right "#(command -v tower-status >/dev/null && tower-status)#[fg=#45403d,bg=#32302f]#[fg=#928374,bg=#45403d] %b %d #[fg=#d4be98]%H:%M #[fg=#45403d,bg=#32302f] "

# prefix + Space: jump to whoever needs you - waiting longest first, then
# idle agents needing their next objective. Repeats cycle like ]q.
# NOTE: this replaces the default `next-layout` on prefix + Space.
bind Space run-shell -b "command -v tower-jump >/dev/null && tower-jump"

# --- switch left and right panes with vim binds ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Same four, but for when Ctrl is still held through the chord. Without these,
# `C-a` followed by `C-h` finds nothing in the prefix table and tmux silently
# drops the key - which feels like lag, but is really a lost keystroke.
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# ── Plugins (tpm) ────────────────────────────────────────────────────
# tpm is cloned to ~/.tmux/plugins/tpm.
#   prefix + I  install plugins declared below
#   prefix + U  update them
#   prefix + alt-u  remove plugins no longer declared
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ── tmux-resurrect ───────────────────────────────────────────────────
#   prefix + C-s  save the whole tmux environment
#   prefix + C-r  restore the last save
# (No conflict with our `bind r` reload, which is plain r, not C-r.)
set -g @resurrect-dir "$HOME/.local/share/mcv/tmux/resurrect"

# Save scrollback too, so a restored pane isn't an empty shell.
set -g @resurrect-capture-pane-contents 'on'

# Deliberately NOT set: @resurrect-strategy-nvim 'session'. That strategy only
# fires when a Session.vim exists in the pane's cwd, and persistence.nvim (via
# LazyVim) saves to stdpath("state")/sessions instead - so it would silently
# fall back to a bare `nvim` anyway. nvim reopens empty; restore your buffers
# with <leader>qs (persistence: restore session for this dir).
#
# Also deliberately NOT added to @resurrect-processes: claude, pi. Respawning an
# agent fleet implicitly on restore is not a thing you want. Restart those by hand.
#
# CAVEAT for tower: resurrect only records pane index/title/cwd/active/command.
# It does NOT save custom `@`-prefixed pane options, which is exactly how tower's
# bus carries agent state - so a restored session comes back with an empty bus and
# `tower-status` will read as no agents running until agents re-publish.

# Keep this last - tpm must run after all plugin declarations.
run "$MCV_SHARE/tmux/plugins/tmux-resurrect/resurrect.tmux"

set -g allow-passthrough on
